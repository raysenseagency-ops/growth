<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaySense - نفهم بيزنست الأول</title>
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style>
        /* تنسيقات الصفحة العامة تشبه الصورة */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a; /* لون خلفية داكن مقارب للصورة */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .logo {
            width: 150px; /* حجم تقريبي للشعار */
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            line-height: 1.2;
            font-weight: bold;
        }
        .highlight {
            color: #38bdf8; /* لون مميز للنص الأزرق */
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8; /* لون رمادي للنص الفرعي */
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* تنسيق الزر ليطابق الصورة */
        .tally-open {
            background-color: #38bdf8; /* لون الزر */
            color: #0f172a; /* لون النص داخل الزر */
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .tally-open:hover {
            background-color: #7dd3fc;
        }
        .sub-text {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- الشعار (يمكنك استبدال الرابط برابط شعارك الفعلي) -->
    <img src="https://i.imgur.com/8qM4Y9u.png" alt="RaySense Logo" class="logo">

    <!-- النصوص الأساسية من الصورة -->
    <h1>
        نفهم بيزنسك الأول،<br>
        <span class="highlight">وبعدين نقرر</span>
    </h1>
    
    <p>مش كل بيزنس محتاج تسويق أكتر. كل بيزنس محتاج قرارات أصح — وده اللي بنكتشفه سوا في استشارة مجانية مدتها 30 دقيقة.</p>

    <!-- زر فتح نموذج Tally -->
    <!-- استبدل الرابط أدناه برابط نموذج Tally الخاص بك -->
    <a href="https://tally.so/r/VLeKal?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" 
       class="tally-open" data-tally-open="VLeKal" data-tally-layout="modal" data-tally-width="600" data-tally-emoji="🚀" data-tally-emoji-animation="wave">
       احجز استشارتك المجانية
    </a>
    
    <p class="sub-text">مفيش أي التزام - 30 دقيقة بس عشان نفهم بعض</p>

</body>
</html>
